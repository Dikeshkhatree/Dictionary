<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dictionary iPhone UI</title>
  <link rel="stylesheet" href="dictionary.css" />
</head>
<body>
  <div class="iphone-frame">
    <div class="notch"></div>
    <div class="iphone-screen">
      <div class="container">
        <h1>📖 Dictionary</h1>
        <div class="input">
          <input type="text" placeholder="Search for a word..." id="input" />
        </div>
        <div class="search">
          <button class="btn" id="search">Search</button>
        </div>

        <div class="fetching-message" id="fetchingMessage"></div>

        <div class="definition" id="result">
          <div class="word">Definition</div>
          <div class="meaning">
            This is the example. You can search here to get the dynamic data.
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="dictionary.js"></script>
</body>
</html>
